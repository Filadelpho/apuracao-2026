<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Apuração 2026 · 2º turno</title>
    <meta name="description" content="Apuração do 2º turno para presidente, município por município, com dados oficiais do TSE." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topo">
      <div class="marca">
        <h1>Apuração 2026</h1>
        <span class="turno" id="turno">2º turno · 25 de outubro</span>
      </div>
      <div class="topo-acoes">
        <p class="status"><i class="ponto-vivo" id="ponto-vivo"></i><span id="status">Carregando…</span></p>
        <span class="selo">Fonte: TSE</span>
        <button class="botao botao-icone" id="compartilhar" aria-label="Compartilhar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg>
        </button>
        <button class="botao so-notebook" id="tela-cheia">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          <span>Tela cheia</span>
        </button>
      </div>
    </header>

    <main class="grade">
      <div class="coluna coluna-esq">
        <section class="cartao placar" id="placar" aria-live="polite"></section>
        <section class="cartao curva" id="curva">
          <h2>Ao longo da apuração</h2>
          <p class="vazio">A curva começa com 1% das seções apuradas.</p>
        </section>
      </div>

      <section class="cartao mapa-bloco">
        <div class="mapa-controles">
          <div class="abas" role="tablist" aria-label="O que o mapa mostra">
            <button role="tab" data-modo="resultado" aria-selected="true">Quem lidera</button>
            <button role="tab" data-modo="mudanca" aria-selected="false">Mudança vs. 1º turno</button>
          </div>
          <div class="legenda" id="legenda"></div>
        </div>
        <div class="mapa" id="mapa">
          <canvas></canvas>
          <div class="dica-mapa" id="dica-mapa" hidden></div>
          <div class="zoom">
            <button data-zoom="in" aria-label="Aproximar">+</button>
            <button data-zoom="out" aria-label="Afastar">−</button>
          </div>
        </div>
        <aside class="detalhe" id="detalhe" hidden></aside>
      </section>

      <div class="coluna coluna-dir">
        <section class="cartao regioes" id="regioes"></section>
        <section class="cartao atualizacoes" id="atualizacoes">
          <h2>Últimas atualizações</h2>
          <p class="vazio">Os primeiros números saem às 17h.</p>
        </section>
      </div>
    </main>

    <footer class="rodape">
      Fonte: TSE (resultados.tse.jus.br) · Malha municipal: IBGE · Projeto independente, sem vínculo com o TSE.
    </footer>
    <div class="aviso" id="aviso" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
